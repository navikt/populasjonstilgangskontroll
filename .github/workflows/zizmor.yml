name: GitHub Actions Security (zizmor)

# Statisk analyse av workflows for sikkerhetsproblemer.
# Resultatet lastes opp som SARIF til GitHub Code Scanning.
# Se: https://woodruffw.github.io/zizmor/

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  schedule:
    # Ukentlig kjøring for å fange nye audits i zizmor.
    - cron: '0 6 * * 1'

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zizmor:
    name: Scan workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write  # codeql-action/upload-sarif publiserer funn til Code Scanning
      actions: read           # zizmor leser workflow-metadata via GH API
    steps:
      - name: Sjekker ut kode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Installer zizmor
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 

      - name: Kjør zizmor
        run: uvx zizmor --format sarif . > zizmor.sarif
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Last opp SARIF til Code Scanning
        uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          sarif_file: zizmor.sarif
          category: zizmor

