name: GitHub Actions Security (zizmor)

# Statisk analyse av workflows for sikkerhetsproblemer.
# Resultatet lastes opp som SARIF til GitHub Code Scanning.
# Se: https://woodruffw.github.io/zizmor/

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  schedule:
    # Ukentlig kjøring for å fange nye audits i zizmor.
    - cron: '0 6 * * 1'

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zizmor:
    name: Scan workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write  # codeql-action/upload-sarif publiserer funn til Code Scanning
      actions: read           # zizmor leser workflow-metadata via GH API
    steps:
      - name: Sjekker ut kode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer zizmor
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Kjør zizmor
        run: uvx zizmor --format sarif . > zizmor.sarif
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Last opp SARIF til Code Scanning
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: zizmor.sarif
          category: zizmor

