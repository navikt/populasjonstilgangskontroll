apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
    name: tilgangmaskin-probe-alerts
    namespace: "tilgangsmaskin"
    labels:
      team: tilgangsmaskin
spec:
  groups:
    - name: probe-errors
      rules:
        - alert: HelsesjekkPdlPipFeilet
          expr: probe_success{instance="http://populasjonstilgangskontroll.tilgangsmaskin/monitoring/health/pdl", namespace="tilgangsmaskin"} == 0
          for: 2m
          annotations:
            consequence: PDL-pip er nede
            action: "Sjekk Grafana og Kibana"
            summary: |-
              Grafana: https://grafana.nav.cloud.nais.io/d/42e329f6-6f6c-4365-84a1-7c65def92463/tilgangmaskin-prod?orgId=1
              Loki securelogs: 
              Kibana securelogs: 
              Kibana åpne logger:
          labels:
            namespace: tilgangsmaskin
            severity: critical
        - alert: HelsesjekkPdlGraphQLFeilet
          expr: probe_success{instance="http://populasjonstilgangskontroll.tilgangsmaskin/monitoring/health/pdlGraph", namespace="tilgangsmaskin"} == 0
          for: 2m
          annotations:
            consequence: PDL er nede
            action: "Sjekk Grafana og Kibana"
            summary: |-
              Grafana: https://grafana.nav.cloud.nais.io/d/42e329f6-6f6c-4365-84a1-7c65def92463/tilgangmaskin-prod?orgId=1
              Loki securelogs: 
              Kibana securelogs: 
              Kibana åpne logger:
          labels:
            namespace: tilgangsmaskin
            severity: critical
        - alert: HelsesjekkSkjermingFeilet
          expr: probe_success{instance="http://populasjonstilgangskontroll.tilgangsmaskin/monitoring/health/skjerming", namespace="tilgangsmaskin"} == 0
          for: 2m
          annotations:
            consequence: Skjermingsløsninen er nede
            action: "Sjekk Grafana og Kibana"
            summary: |-
              Grafana: https://grafana.nav.cloud.nais.io/d/42e329f6-6f6c-4365-84a1-7c65def92463/tilgangmaskin-prod?orgId=1
              Loki securelogs: 
              Kibana securelogs: 
              Kibana åpne logger:
          labels:
            namespace: tilgangsmaskin
            severity: critical
        - alert: HelsesjekkValKeyFeilet
          expr: probe_success{instance="http://populasjonstilgangskontroll.tilgangsmaskin/monitoring/health/cache", namespace="tilgangsmaskin"} == 0
          for: 2m
          annotations:
