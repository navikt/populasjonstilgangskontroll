          labels:
            namespace: tilgangsmaskin
            severity: critical
        - alert: HelsesjekkDatabaseFeilet
          expr: probe_success{instance="http://populasjonstilgangskontroll.tilgangsmaskin/monitoring/health/db", namespace="tilgangsmaskin"} == 0
          for: 2m
          annotations:
            consequence: Databasen er nede
            action: "Sjekk Grafana og Kibana"
