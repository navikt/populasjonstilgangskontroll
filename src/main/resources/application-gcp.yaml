server:
  shutdown: graceful
  jetty:
    threads:
      max: 200
management:
  info:
    os:
      enabled: true
    git:
      enabled: true
    java:
      enabled: true
    env:
      enabled: true
  auditevents:
    enabled: false
  observations:
    annotations:
      enabled: true
  health:
    redis:
      enabled: false
    ssl:
      enabled: false
    ping:
      enabled: false
    diskspace:
      enabled: false
  endpoints:
    web:
      base-path: /monitoring

spring:
  http:
    serviceclient:
        pdlpip:
          base-url: "https://${pdlpip}"
        verge:
          base-url: "http://repr-api.repr"
        skjerming:
          base-url: "http://skjermede-personer-pip.nom"
        entraproxy:
          base-url: "http://entra-proxy.sikkerhetstjenesten"
        graph:
          base-url: "https://graph.microsoft.com/v1.0"
    clients:
      connect-timeout: 3s
      read-timeout: 5s

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${azure.openid.config.issuer}
          audiences:
            - ${azure.app.client.id}
      client:
        provider:
          azuread:
            issuer-uri: ${azure.openid.config.issuer}
        registration:
          skjerming:
            provider: azuread
            client-id: ${azure.app.client.id}
            client-secret: ${azure.app.client.secret}
            authorization-grant-type: client_credentials
            scope:
              - "api://${nais.cluster.type}-gcp.nom.skjermede-personer-pip/.default"
          entraproxy:
            provider: azuread
            client-id: ${azure.app.client.id}
            client-secret: ${azure.app.client.secret}
            authorization-grant-type: client_credentials
            scope:
              - "api://${nais.cluster.type}-gcp.sikkerhetstjenesten.entra-proxy/.default"
          graph:
            provider: azuread
            client-id: ${azure.app.client.id}
            client-secret: ${azure.app.client.secret}
            authorization-grant-type: client_credentials
            scope:
              - "https://graph.microsoft.com/.default"
          pdlpip:
            provider: azuread
            client-id: ${azure.app.client.id}
            client-secret: ${azure.app.client.secret}
            authorization-grant-type: client_credentials
            scope:
              - "api://${nais.cluster.type}-fss.pdl.pdl-pip-api/.default"
          pdlgraph:
            provider: azuread
            client-id: ${azure.app.client.id}
            client-secret: ${azure.app.client.secret}
            authorization-grant-type: client_credentials
            scope:
              - "api://${nais.cluster.type}-fss.pdl.pdl-api/.default"
          verge:
            provider: azuread
            client-id: ${azure.app.client.id}
            client-secret: ${azure.app.client.secret}
            authorization-grant-type: client_credentials
            scope:
              - "api://${nais.cluster.type}-gcp.repr.repr-api/.default"
  messages:
    fallback-to-system-locale: false
  web:
    locale: no_NO
    locale-resolver: fixed
  threads:
    virtual:
      enabled: true
  application:
    name: populasjonstilgangskontroll
  kafka:
    bootstrap-servers: ${kafka.brokers}
    properties:
      ssl:
        endpoint:
          identification:
            algorithm: ''
    security:
      protocol: SSL
    ssl:
      trust-store-location: file:${kafka.truststore.path}
      trust-store-type: JKS
      trust-store-password: ${kafka.credstore.password}
      key-store-location: file:${kafka.keystore.path}
      key-store-type: PKCS12
      key-store-password: ${kafka.credstore.password}

    consumer:
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

      properties:
        "[auto.offset.reset]": earliest
        "[spring.json.use.type.headers]": false
        "[spring.json.trusted.packages]": no.nav.tilgangsmaskin
        "[spring.deserializer.key.delegate.class]": org.apache.kafka.common.serialization.StringDeserializer
        "[spring.deserializer.value.delegate.class]": org.springframework.kafka.support.serializer.JacksonJsonDeserializer

  data:
    redis:
      repositories:
            enabled: false
      lettuce:
        pool:
          enabled: true
          max-active: 24
          max-idle: 24
        shutdown-timeout: 2s

      host: ${valkey.host.${nais.cluster.cache}}
      port: ${valkey.port.${nais.cluster.cache}}
      connect-timeout: 10s
      timeout: 5s
      username: ${valkey.username.${nais.cluster.cache}}
      password: ${valkey.password.${nais.cluster.cache}}
      ssl:
        enabled: true
  cache:
    type: redis
    redis:
      enable-statistics: true
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${db.jdbc.url}
    username: ${db.username}
    password: ${db.password}
    hikari:
      connection-timeout: 5000
      max-lifetime: 1200000
      idle-timeout: 600000
      connection-test-query: SELECT 1
      maximum-pool-size: ${db.poolsize}
    connection-fetch: lazy
  main:
    banner-mode: off
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    default-property-inclusion: non_null

springdoc:
  swagger-ui:
    oauth:
      client-id: ${azure.app.client.id}
    csrf:
      enabled: true
info:
  cluster: ${nais.cluster.name:local}
  name: ${spring.application.name}
  image: ${nais.app.image:unknown}

logbook:
  predicate:
   exclude:
    -  path: /monitoring/**
