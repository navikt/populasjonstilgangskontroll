query aktivLederForRessurs {
    ressurs(where: {navident: "G155033"}) {
        navident
        visningsnavn
        orgTilknytninger (utvalg: AKTIVE) {
            orgEnhet {
                id
                navn
                ledere (utvalg: AKTIVE) {
                    ressurs {
                        navident
                        visningsnavn
                    }
                }
            }
            erDagligOppfolging
        }
    }
}